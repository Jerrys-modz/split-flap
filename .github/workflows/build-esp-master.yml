name: 'Build ESP Master Sketch'

on:
  pull_request:    
    branches:
      - master
    paths:
      - 'ESPMaster/**'
  schedule:
    - cron: '0 12 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile-esp-sketch:
    name: "Build ESP Master Sketch (${{ matrix.board.name }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          - name: esp8266
            fqbn: "esp8266:esp8266:generic"
            platform-name: esp8266:esp8266
            platform-source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          - name: esp32
            fqbn: "esp32:esp32:esp32"
            platform-name: esp32:esp32
            platform-source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: ${{ matrix.board.platform-name }}
              source-url: ${{ matrix.board.platform-source-url }}
          sketch-paths: |
            - ./ESPMaster
          libraries: |
            - name: ArduinoJson
              version: 7.0.4
            - name: ArduinoOTA
              version: 1.1.0
            - name: ESPAsyncWebSrv
              version: 1.2.7
            - name: ezTime
              version: 0.8.3
            - name: NTPClient
              version: 3.2.1
            - name: LinkedList
              version: 1.3.3
            - name: WiFiManager
              version: 2.0.17
          cli-compile-flags: |
            - --warnings
            - "none"
